vulnerabilities:
  # torch 2.0.1 pinned by upstream RELION ver5.0 (relion:5.0*, relion-zarr-sta*); 5.1 is fixed
  - id: CVE-2025-32434
    statement: torch.load RCE; needs an untrusted checkpoint, RELION loads only its own upstream weights (downloaded on first use).
    purls:
      - pkg:pypi/torch@2.0.1
  - id: CVE-2024-31580
    statement: torch mobile/lite interpreter heap overflow; RELION does not use the lite interpreter.
    purls:
      - pkg:pypi/torch@2.0.1
  - id: CVE-2024-31583
    statement: torch mobile/lite interpreter use-after-free; RELION does not use the lite interpreter.
    purls:
      - pkg:pypi/torch@2.0.1

  # pip's own vendored copies (pip/_vendor); drop once a pip release vendors fixed versions
  - id: GHSA-6v7p-g79w-8964
    statement: SEGV is in the msgpack C extension; pip vendors the pure-Python fallback only.
    purls:
      - pkg:pypi/msgpack@1.1.2
  - id: CVE-2025-47273
    statement: Bug is in setuptools.package_index; pip vendors only pkg_resources.
    purls:
      - pkg:pypi/setuptools@70.3.0

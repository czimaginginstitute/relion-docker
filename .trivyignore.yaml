vulnerabilities:
  # torch 2.0.1 is pinned by upstream RELION ver5.0 (environment.yml); present in relion:5.0*
  # and relion-zarr-sta*. The 5.1 images ship a fixed torch. Revisit when upstream bumps torch.
  - id: CVE-2025-32434
    statement: torch.load RCE; needs an untrusted checkpoint, RELION loads only bundled weights.
    purls:
      - pkg:pypi/torch@2.0.1
  - id: CVE-2024-31580
    statement: torch mobile/lite interpreter heap overflow; RELION does not use the lite interpreter.
    purls:
      - pkg:pypi/torch@2.0.1
  - id: CVE-2024-31583
    statement: torch mobile/lite interpreter use-after-free; RELION does not use the lite interpreter.
    purls:
      - pkg:pypi/torch@2.0.1

  # Copies vendored inside pip (pip/_vendor), not importable packages. No pip release vendors
  # fixed versions yet (pip main has msgpack 1.2.1). Remove once a pip release picks them up.
  - id: GHSA-6v7p-g79w-8964
    statement: SEGV is in the msgpack C extension; pip vendors the pure-Python fallback only.
    purls:
      - pkg:pypi/msgpack@1.1.2
  - id: CVE-2025-47273
    statement: Bug is in setuptools.package_index; pip vendors only pkg_resources.
    purls:
      - pkg:pypi/setuptools@70.3.0

name: Build & Push RELION (CUDA) to Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: dockerhub-relion-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/relion
  DOCKER_FILE: Dockerfile.relion-cuda
  RELION_REF_DEFAULT: ver5.0

jobs:
  build-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: "12.8.0"
            relion_ref: "ver5.0"
          - cuda: "12.6.0"
            relion_ref: "ver5.0"
          - cuda: "12.4.1"
            relion_ref: "ver5.0"
          - cuda: "12.2.0"
            relion_ref: "ver5.0"
          - cuda: "11.8.0"
            relion_ref: "ver5.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system df

      - name: Set up QEMU (not used for CUDA, but harmless)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        run: |
          RELION_REF="${{ matrix.relion_ref || env.RELION_REF_DEFAULT }}"
          CUDA_VERSION="${{ matrix.cuda }}"
          CUDA_MAJOR_MINOR="$(echo "${CUDA_VERSION}" | awk -F. '{print $1"."$2}')"
          TAG_MAIN="${RELION_REF#ver}-cuda${CUDA_MAJOR_MINOR}"
          TAG_FULL="${RELION_REF#ver}-cuda${CUDA_VERSION}"

          echo "relion_ref=${RELION_REF}" >> $GITHUB_OUTPUT
          echo "cuda_version=${CUDA_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_main=${TAG_MAIN}" >> $GITHUB_OUTPUT
          echo "tag_full=${TAG_FULL}" >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          file: ${{ env.DOCKER_FILE }}
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            RELION_REF=${{ steps.meta.outputs.relion_ref }}
            CUDA_VERSION=${{ steps.meta.outputs.cuda_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
          labels: |
            org.opencontainers.image.title=relion
            org.opencontainers.image.description=RELION built with CUDA ${{ steps.meta.outputs.cuda_version }} (ref ${{ steps.meta.outputs.relion_ref }})
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

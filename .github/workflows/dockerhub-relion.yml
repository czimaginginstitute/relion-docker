name: Build & Push RELION (CUDA) to Docker Hub & GitHub Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: docker-relion-${{ github.ref }}
  cancel-in-progress: true

env:
  RELION_REF_DEFAULT: ver5.0
  DOCKERHUB_RELION_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/relion
  DOCKERHUB_CDP_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cryoet-data-portal-relion-sta
  GHCR_RELION_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/relion
  GHCR_CDP_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cryoet-data-portal-relion-sta

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: "12.8.0"
            relion_ref: "ver5.0"
          - cuda: "12.6.0"
            relion_ref: "ver5.0"
          - cuda: "12.4.1"
            relion_ref: "ver5.0"
          - cuda: "12.2.0"
            relion_ref: "ver5.0"
          - cuda: "11.8.0"
            relion_ref: "ver5.0"

    steps:
      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Free up runner disk space
        run: |
          set +e
          sudo apt-get purge temurin-*-jdk adoptopenjdk-* adoptium-ca-certificates openjdk-* session-manager-plugin azure-cli google-cloud-cli heroku
          sudo apt-get purge postgresql-* libpq-dev libmysqlclient* msodbcsql* mssql-tools unixodbc-dev mysql-client* mysql-common mysql-server* php*-*sql sphinxsearch mongodb*
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/terraform
          sudo rm -rf /usr/lib/jvm/ /usr/local/graalvm /usr/share/java/selenium-server*.jar
          sudo rm -rf /usr/share/mysql* /opt/mssql-tools /usr/local/sqlpackage
          sudo rm -rf /usr/local/bin/aliyun /usr/local/bin/aws /usr/local/bin/aws_completer /usr/local/aws-cli /usr/local/aws /usr/local/aws-sam-cli /usr/local/bin/azcopy* /usr/share/az_* /opt/az /usr/bin/az /usr/share/google-cloud-sdk /usr/lib/google-cloud-sdk /usr/local/bin/bicep /usr/local/bin/oc /usr/local/bin/oras /usr/local/lib/heroku
          docker system df

      - name: Set up QEMU (not used for CUDA, but harmless)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        run: |
          RELION_REF="${{ matrix.relion_ref || env.RELION_REF_DEFAULT }}"
          CUDA_VERSION="${{ matrix.cuda }}"
          CUDA_MAJOR_MINOR="$(echo "${CUDA_VERSION}" | awk -F. '{print $1"."$2}')"
          TAG_MAIN="${RELION_REF#ver}-cuda${CUDA_MAJOR_MINOR}"
          TAG_FULL="${RELION_REF#ver}-cuda${CUDA_VERSION}"

          echo "relion_ref=${RELION_REF}" >> $GITHUB_OUTPUT
          echo "cuda_version=${CUDA_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_main=${TAG_MAIN}" >> $GITHUB_OUTPUT
          echo "tag_full=${TAG_FULL}" >> $GITHUB_OUTPUT

      - name: Build & Push RELION-only Image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.relion
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            RELION_REF=${{ steps.meta.outputs.relion_ref }}
            CUDA_VERSION=${{ steps.meta.outputs.cuda_version }}
          tags: |
            ${{ env.DOCKERHUB_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.DOCKERHUB_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
            ${{ env.GHCR_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.GHCR_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
          labels: |
            org.opencontainers.image.title=relion
            org.opencontainers.image.description=RELION built with CUDA ${{ steps.meta.outputs.cuda_version }} (ref ${{ steps.meta.outputs.relion_ref }})
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Free up runner disk space (again)
        run: |
          set +e
          docker rmi ${{ env.DOCKERHUB_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
          docker rmi ${{ env.DOCKERHUB_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
          docker rmi ${{ env.GHCR_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
          docker rmi ${{ env.GHCR_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
          docker builder prune -af
          docker system prune -af --volumes

      - name: Checkout portal-particle-extraction
        uses: actions/checkout@v5
        with:
          repository: czimaginginstitute/portal-particle-extraction
          token: ${{ secrets.GH_TOKEN }}
          path: portal-particle-extraction
          fetch-depth: 1

      - name: Checkout relion-sub-tomogram-pipelines
        uses: actions/checkout@v5
        with:
          repository: czimaginginstitute/relion-sub-tomogram-pipelines
          token: ${{ secrets.GH_TOKEN }}
          path: relion-sub-tomogram-pipelines
          fetch-depth: 1

      - name: Build & Push CDP-RELION-STA Image
        uses: docker/build-push-action@v6
        with:
          file: extras/Dockerfile.cdp-relion-sta
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            RELION_REF=${{ steps.meta.outputs.relion_ref }}
            CUDA_VERSION=${{ steps.meta.outputs.cuda_version }}
            PORTAL_PARTICLE_EXTRACTION_LOCATION=portal-particle-extraction
            PYRELION_LOCATION=relion-sub-tomogram-pipelines
          tags: |
            ${{ env.GHCR_CDP_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.GHCR_CDP_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
          labels: |
            org.opencontainers.image.title=cryoet-data-portal-relion-sta
            org.opencontainers.image.description=RELION with CryoET Data Portal STA pipeline tools, built with CUDA ${{ steps.meta.outputs.cuda_version }} (ref ${{ steps.meta.outputs.relion_ref }})
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
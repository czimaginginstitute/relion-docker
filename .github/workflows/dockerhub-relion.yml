name: Build & Push RELION (CUDA) to Docker Hub & GitHub Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'   # weekly: picks up apt security fixes (APT_REFRESH) and upstream ver5.x moves

concurrency:
  group: docker-relion-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dependabot PRs get no secrets; fallback only names unpushed PR builds
  DOCKERHUB_RELION_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'dependabot-pr' }}/relion
  DOCKERHUB_RELION_ZARR_STA_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'dependabot-pr' }}/relion-zarr-sta
  GHCR_RELION_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/relion
  GHCR_RELION_ZARR_STA_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/relion-zarr-sta
  GHCR_BUILDCACHE: ghcr.io/${{ github.repository_owner }}/relion-buildcache

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # needed by dorny/paths-filter
    outputs:
      images: ${{ steps.filter.outputs.images }}
      relion_zarr_sta: ${{ steps.filter.outputs.relion_zarr_sta }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for image-relevant changes
        # paths-filter has no base outside PRs; non-PR runs always build
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            images:
              - 'Dockerfile.relion'
              - 'extras/**'
              - 'THIRD_PARTY_LICENSES.md'
              - '.dockerignore'
              - '.github/workflows/dockerhub-relion.yml'
            relion_zarr_sta:
              - 'extras/Dockerfile.relion-zarr-sta'
              - 'Dockerfile.relion'
              - '.github/workflows/dockerhub-relion.yml'

  build-push:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.images == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # cuda_arch: ver5.1 takes a CMake list, ver5.0 a single number
        include:
          - relion_ref: "ver5.1"
            cuda: "12.8.0"
            cuda_arch: "80-real;86-real;89-real;90-real;100-real;120-real;120-virtual"
            build_relion_zarr_sta: false
          - relion_ref: "ver5.0"
            cuda: "12.8.0"
            cuda_arch: "80"
            build_relion_zarr_sta: true
          - relion_ref: "ver5.0"
            cuda: "12.4.1"
            cuda_arch: "80"
            build_relion_zarr_sta: true

    steps:
      - name: Maximize build space (#1)
        uses: mathio/gha-cleanup@aca3d43a05bf564f5fc69acb929a65b01797f22b # v1
        with:
          remove-browsers: true
          verbose: true

      - name: Maximize build space (#2)
        run: |
          set +e
          # one missing pattern would abort the whole purge
          pkgs=$(dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' \
            'temurin-*' 'adoptopenjdk-*' 'adoptium-ca-certificates' 'openjdk-*' 'session-manager-plugin' \
            'azure-cli' 'google-cloud-cli' 'heroku' 'postgresql-*' 'libpq-dev' 'libmysqlclient*' 'msodbcsql*' \
            'mssql-tools*' 'unixodbc-dev' 'mysql-client*' 'mysql-common' 'mysql-server*' 'php*-*sql' \
            'sphinxsearch' 'mongodb*' 2>/dev/null | awk '$1=="ii"{print $2}')
          [ -n "$pkgs" ] && sudo apt-get purge -y -qq $pkgs
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/terraform
          sudo rm -rf /usr/lib/jvm/ /usr/local/graalvm /usr/share/java/selenium-server*.jar
          sudo rm -rf /usr/share/mysql* /opt/mssql-tools /usr/local/sqlpackage
          sudo rm -rf /usr/local/lib/node_modules /usr/local/share/vcpkg /usr/share/miniconda /opt/pipx /usr/share/kotlinc
          sudo rm -rf /usr/lib/llvm-* /home/runner/.rustup /etc/skel/.rustup /home/packer
          sudo rm -rf /usr/local/bin/aliyun /usr/local/bin/aws /usr/local/bin/aws_completer /usr/local/aws-cli /usr/local/aws /usr/local/aws-sam-cli /usr/local/bin/azcopy* /usr/share/az_* /opt/az /usr/bin/az /usr/share/google-cloud-sdk /usr/lib/google-cloud-sdk /usr/local/bin/bicep /usr/local/bin/oc /usr/local/bin/oras /usr/local/lib/heroku
          docker rm -vf $(docker ps -aq)
          docker rmi -f $(docker images -aq)
          docker system df

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true   # materialize the vendored CTFFIND tarball (not just its LFS pointer)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        # also on PRs: build cache, and zarr-sta builds FROM the private GHCR relion image
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        run: |
          RELION_REF="${{ matrix.relion_ref }}"
          echo "RELION_RELEASE=${RELION_REF#ver}" >> $GITHUB_ENV
          CUDA_VERSION="${{ matrix.cuda }}"
          CUDA_MAJOR_MINOR="$(echo "${CUDA_VERSION}" | awk -F. '{print $1"."$2}')"
          TAG_MAIN="${RELION_REF#ver}-cuda${CUDA_MAJOR_MINOR}"
          TAG_FULL="${RELION_REF#ver}-cuda${CUDA_VERSION}"

          RELION_SHA="$(git ls-remote https://github.com/3dem/relion.git "${RELION_REF}" | head -n1 | cut -f1)"
          [ -n "$RELION_SHA" ] || { echo "could not resolve ${RELION_REF}"; exit 1; }

          echo "relion_ref=${RELION_REF}" >> $GITHUB_OUTPUT
          echo "relion_sha=${RELION_SHA}" >> $GITHUB_OUTPUT
          echo "cuda_version=${CUDA_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_main=${TAG_MAIN}" >> $GITHUB_OUTPUT
          echo "tag_full=${TAG_FULL}" >> $GITHUB_OUTPUT
          echo "apt_refresh=$(date -u +%G-W%V)" >> $GITHUB_OUTPUT

      - name: Build & Push RELION-only Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: Dockerfile.relion
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          build-args: |
            RELION_REF=${{ steps.meta.outputs.relion_ref }}
            CUDA_VERSION=${{ steps.meta.outputs.cuda_version }}
            CUDA_ARCH=${{ matrix.cuda_arch }}
            RELION_SHA=${{ steps.meta.outputs.relion_sha }}
            APT_REFRESH=${{ steps.meta.outputs.apt_refresh }}
          tags: |
            ${{ env.DOCKERHUB_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.DOCKERHUB_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
            ${{ env.GHCR_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.GHCR_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
          labels: |
            org.opencontainers.image.title=relion
            org.opencontainers.image.description=RELION built with CUDA ${{ steps.meta.outputs.cuda_version }} (ref ${{ steps.meta.outputs.relion_ref }})
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.relion.source.revision=${{ steps.meta.outputs.relion_sha }}
          # ignore-error: read-only tokens (Dependabot) still build
          cache-from: type=registry,ref=${{ env.GHCR_BUILDCACHE }}:relion-${{ steps.meta.outputs.tag_full }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:relion-{1},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.GHCR_BUILDCACHE, steps.meta.outputs.tag_full) || '' }}

      - name: Free up runner disk space (again)
        run: |
          set +e
          docker buildx prune -af
          docker system prune -af --volumes

      - name: Show disk space
        run: |
          df -h
          docker system df

      - name: Build & Push RELION-Zarr-STA Image
        if: ${{ matrix.build_relion_zarr_sta && (github.event_name != 'pull_request' || needs.changes.outputs.relion_zarr_sta == 'true') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: extras/Dockerfile.relion-zarr-sta
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          build-args: |
            RELION_RELEASE=${{ env.RELION_RELEASE }}
            CUDA_VERSION=${{ steps.meta.outputs.cuda_version }}
          tags: |
            ${{ env.DOCKERHUB_RELION_ZARR_STA_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.DOCKERHUB_RELION_ZARR_STA_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
            ${{ env.GHCR_RELION_ZARR_STA_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.GHCR_RELION_ZARR_STA_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
          labels: |
            org.opencontainers.image.title=relion-zarr-sta
            org.opencontainers.image.description=RELION with zarr-particle-tools and py2rely for CryoET Data Portal STA workflows, built with CUDA ${{ steps.meta.outputs.cuda_version }} (ref ${{ steps.meta.outputs.relion_ref }})
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.relion.source.revision=${{ steps.meta.outputs.relion_sha }}
          cache-from: type=registry,ref=${{ env.GHCR_BUILDCACHE }}:relion-zarr-sta-${{ steps.meta.outputs.tag_full }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:relion-zarr-sta-{1},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.GHCR_BUILDCACHE, steps.meta.outputs.tag_full) || '' }}

      - name: Show disk space (end)
        run: |
          df -h
          docker system df

  publish-sif:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with build-push tag_main
        tag: [ "5.1-cuda12.8", "5.0-cuda12.8", "5.0-cuda12.4" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      # skip if the SIF was already built from these layers
      - name: Check whether SIF is current
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ github.repository_owner }}/relion
          SIF: ${{ github.repository_owner }}/relion-sif
        run: |
          key=$(.github/scripts/sif-source-key.sh key "$SRC" "${{ matrix.tag }}")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if .github/scripts/sif-source-key.sh current "$SIF" "${{ matrix.tag }}" "$key"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::$SIF:${{ matrix.tag }} already built from layers $key; skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # unpacking the large conda env for SIF conversion needs the headroom
      - name: Maximize build space
        if: steps.check.outputs.skip != 'true'
        uses: mathio/gha-cleanup@aca3d43a05bf564f5fc69acb929a65b01797f22b # v1
        with:
          remove-browsers: true
          verbose: true

      - name: Show disk space (start)
        if: steps.check.outputs.skip != 'true'
        run: df -h

      - name: Use $RUNNER_TEMP for Apptainer scratch
        if: steps.check.outputs.skip != 'true'
        # apptainer also writes temp files next to the .sif
        run: |
          mkdir -p "$RUNNER_TEMP/aptmp" "$RUNNER_TEMP/apcache"
          echo "APPTAINER_TMPDIR=$RUNNER_TEMP/aptmp" >> "$GITHUB_ENV"
          echo "APPTAINER_CACHEDIR=$RUNNER_TEMP/apcache" >> "$GITHUB_ENV"
          echo "SIF_PATH=$RUNNER_TEMP/relion.sif" >> "$GITHUB_ENV"

      - name: Set up Apptainer
        if: steps.check.outputs.skip != 'true'
        uses: eWaterCycle/setup-apptainer@3f706d898c9db585b1d741b4692e66755f3a1b40 # v2

      - name: Log in to GHCR (oras)
        if: steps.check.outputs.skip != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login -u "${{ github.actor }}" --password-stdin oras://ghcr.io

      - name: Convert pushed image to SIF and publish
        if: steps.check.outputs.skip != 'true'
        run: |
          apptainer pull "$SIF_PATH" "docker://${{ env.GHCR_RELION_IMAGE_NAME }}:${{ matrix.tag }}"
          apptainer push "$SIF_PATH" "oras://ghcr.io/${{ github.repository_owner }}/relion-sif:${{ matrix.tag }}"

      - name: Tag SIF with its source layer key
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/sif-source-key.sh mark "${{ github.repository_owner }}/relion-sif" "${{ matrix.tag }}" "${{ steps.check.outputs.key }}"

      - name: Show disk space (end)
        if: always() && steps.check.outputs.skip != 'true'
        run: df -h

  publish-relion-zarr-sta-sif:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        tag: [ "5.0-cuda12.8", "5.0-cuda12.4" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      # skip if the SIF was already built from these layers
      - name: Check whether SIF is current
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ github.repository_owner }}/relion-zarr-sta
          SIF: ${{ github.repository_owner }}/relion-zarr-sta-sif
        run: |
          key=$(.github/scripts/sif-source-key.sh key "$SRC" "${{ matrix.tag }}")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if .github/scripts/sif-source-key.sh current "$SIF" "${{ matrix.tag }}" "$key"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::$SIF:${{ matrix.tag }} already built from layers $key; skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Maximize build space
        if: steps.check.outputs.skip != 'true'
        uses: mathio/gha-cleanup@aca3d43a05bf564f5fc69acb929a65b01797f22b # v1
        with:
          remove-browsers: true
          verbose: true

      - name: Show disk space (start)
        if: steps.check.outputs.skip != 'true'
        run: df -h

      - name: Use $RUNNER_TEMP for Apptainer scratch
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/aptmp" "$RUNNER_TEMP/apcache"
          echo "APPTAINER_TMPDIR=$RUNNER_TEMP/aptmp" >> "$GITHUB_ENV"
          echo "APPTAINER_CACHEDIR=$RUNNER_TEMP/apcache" >> "$GITHUB_ENV"
          echo "SIF_PATH=$RUNNER_TEMP/relion-zarr-sta.sif" >> "$GITHUB_ENV"

      - name: Set up Apptainer
        if: steps.check.outputs.skip != 'true'
        uses: eWaterCycle/setup-apptainer@3f706d898c9db585b1d741b4692e66755f3a1b40 # v2

      - name: Log in to GHCR (oras)
        if: steps.check.outputs.skip != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login -u "${{ github.actor }}" --password-stdin oras://ghcr.io

      - name: Convert pushed image to SIF and publish
        if: steps.check.outputs.skip != 'true'
        run: |
          apptainer pull "$SIF_PATH" "docker://${{ env.GHCR_RELION_ZARR_STA_IMAGE_NAME }}:${{ matrix.tag }}"
          apptainer push "$SIF_PATH" "oras://ghcr.io/${{ github.repository_owner }}/relion-zarr-sta-sif:${{ matrix.tag }}"

      - name: Tag SIF with its source layer key
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/sif-source-key.sh mark "${{ github.repository_owner }}/relion-zarr-sta-sif" "${{ matrix.tag }}" "${{ steps.check.outputs.key }}"

      - name: Show disk space (end)
        if: always() && steps.check.outputs.skip != 'true'
        run: df -h

  # stable required check (matrix leg names change)
  ci-pass:
    needs: [ changes, build-push ]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require build-push to have succeeded (or been skipped for a non-image PR)
        run: |
          changes="${{ needs.changes.result }}"; build="${{ needs.build-push.result }}"; images="${{ needs.changes.outputs.images }}"
          echo "changes: $changes, images: $images, build-push: $build"
          [ "$changes" = "success" ] || exit 1
          [ "$build" = "success" ] && exit 0
          [ "$build" = "skipped" ] && [ "$images" != "true" ] && [ "${{ github.event_name }}" = "pull_request" ] && exit 0
          exit 1

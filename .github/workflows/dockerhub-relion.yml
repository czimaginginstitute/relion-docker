name: Build & Push RELION (CUDA) to Docker Hub & GitHub Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: docker-relion-${{ github.ref }}
  cancel-in-progress: true

env:
  RELION_REF_DEFAULT: ver5.0
  DOCKERHUB_RELION_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/relion
  GHCR_RELION_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/relion
  GHCR_RELION_ZARR_STA_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/relion-zarr-sta

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read   # needed by dorny/paths-filter

    strategy:
      fail-fast: false
      matrix:
        # cuda_arch: ver5.1 takes a CMake list, ver5.0 a single number. build_relion_zarr_sta gates
        # the relion-zarr-sta image.
        include:
          - relion_ref: "ver5.1"
            cuda: "12.8.0"
            cuda_arch: "80-real;86-real;89-real;90-real;120-real;120-virtual"
            build_relion_zarr_sta: false
          - relion_ref: "ver5.0"
            cuda: "12.8.0"
            cuda_arch: "80"
            build_relion_zarr_sta: true
          - relion_ref: "ver5.0"
            cuda: "12.4.1"
            cuda_arch: "80"
            build_relion_zarr_sta: true

    steps:
      # Note: these maximize build space steps may overlap in functionality, but trying to remove as much as we can
      - name: Maximize build space (#1)
        uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - name: Maximize build space (#2)
        run: |
          set +e
          sudo apt-get purge temurin-*-jdk adoptopenjdk-* adoptium-ca-certificates openjdk-* session-manager-plugin azure-cli google-cloud-cli heroku
          sudo apt-get purge postgresql-* libpq-dev libmysqlclient* msodbcsql* mssql-tools unixodbc-dev mysql-client* mysql-common mysql-server* php*-*sql sphinxsearch mongodb*
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/terraform
          sudo rm -rf /usr/lib/jvm/ /usr/local/graalvm /usr/share/java/selenium-server*.jar
          sudo rm -rf /usr/share/mysql* /opt/mssql-tools /usr/local/sqlpackage
          sudo rm -rf /usr/local/bin/aliyun /usr/local/bin/aws /usr/local/bin/aws_completer /usr/local/aws-cli /usr/local/aws /usr/local/aws-sam-cli /usr/local/bin/azcopy* /usr/share/az_* /opt/az /usr/bin/az /usr/share/google-cloud-sdk /usr/lib/google-cloud-sdk /usr/local/bin/bicep /usr/local/bin/oc /usr/local/bin/oras /usr/local/lib/heroku
          docker rm -vf $(docker ps -aq)
          docker rmi -f $(docker images -aq)
          docker system df

      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true   # materialize the vendored CTFFIND tarball (not just its LFS pointer)

      - name: Check for relion-zarr-sta-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relion_zarr_sta:
              - 'extras/Dockerfile.relion-zarr-sta'
              - 'Dockerfile.relion'
              - '.github/workflows/dockerhub-relion.yml'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        # also needed on PRs: relion-zarr-sta builds FROM the private ghcr.io/.../relion image
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relion_zarr_sta == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        run: |
          RELION_REF="${{ matrix.relion_ref || env.RELION_REF_DEFAULT }}"
          echo "RELION_RELEASE=${RELION_REF#ver}" >> $GITHUB_ENV
          CUDA_VERSION="${{ matrix.cuda }}"
          CUDA_MAJOR_MINOR="$(echo "${CUDA_VERSION}" | awk -F. '{print $1"."$2}')"
          TAG_MAIN="${RELION_REF#ver}-cuda${CUDA_MAJOR_MINOR}"
          TAG_FULL="${RELION_REF#ver}-cuda${CUDA_VERSION}"

          echo "relion_ref=${RELION_REF}" >> $GITHUB_OUTPUT
          echo "cuda_version=${CUDA_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_main=${TAG_MAIN}" >> $GITHUB_OUTPUT
          echo "tag_full=${TAG_FULL}" >> $GITHUB_OUTPUT

      - name: Build & Push RELION-only Image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.relion
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          build-args: |
            RELION_REF=${{ steps.meta.outputs.relion_ref }}
            CUDA_VERSION=${{ steps.meta.outputs.cuda_version }}
            CUDA_ARCH=${{ matrix.cuda_arch }}
          tags: |
            ${{ env.DOCKERHUB_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.DOCKERHUB_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
            ${{ env.GHCR_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.GHCR_RELION_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
          labels: |
            org.opencontainers.image.title=relion
            org.opencontainers.image.description=RELION built with CUDA ${{ steps.meta.outputs.cuda_version }} (ref ${{ steps.meta.outputs.relion_ref }})
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Free up runner disk space (again)
        run: |
          set +e
          docker rm -vf $(docker ps -aq)
          docker rmi -f $(docker images -aq)
          docker builder prune -af
          docker system prune -af --volumes

      - name: Show disk space
        run: |
          df -h
          docker system df

      - name: Build & Push RELION-Zarr-STA Image
        # push only on merge to main; build-only on PRs touching relevant files
        if: ${{ matrix.build_relion_zarr_sta && (github.event_name != 'pull_request' || steps.filter.outputs.relion_zarr_sta == 'true') }}
        uses: docker/build-push-action@v6
        with:
          file: extras/Dockerfile.relion-zarr-sta
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          build-args: |
            RELION_RELEASE=${{ env.RELION_RELEASE }}
            CUDA_VERSION=${{ steps.meta.outputs.cuda_version }}
          tags: |
            ${{ env.GHCR_RELION_ZARR_STA_IMAGE_NAME }}:${{ steps.meta.outputs.tag_main }}
            ${{ env.GHCR_RELION_ZARR_STA_IMAGE_NAME }}:${{ steps.meta.outputs.tag_full }}
          labels: |
            org.opencontainers.image.title=relion-zarr-sta
            org.opencontainers.image.description=RELION with zarr-particle-tools and py2rely for CryoET Data Portal STA workflows, built with CUDA ${{ steps.meta.outputs.cuda_version }} (ref ${{ steps.meta.outputs.relion_ref }})
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show disk space (end)
        run: |
          df -h
          docker system df

  # Convert the pushed images to SIF and publish them to the relion-sif GHCR package.
  publish-sif:
    needs: build-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with build-push tags (tag_main form)
        tag: [ "5.1-cuda12.8", "5.0-cuda12.8", "5.0-cuda12.4" ]
    steps:
      # relion's conda env (PyTorch/napari/cuDNN/NCCL, used by blush/classranker/topaz/tomo-view)
      # is large and not removable; unpacking it for SIF conversion needs real headroom.
      - name: Maximize build space
        uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - name: Show disk space (start)
        run: df -h

      - name: Use $RUNNER_TEMP for Apptainer scratch
        # apptainer writes temp files directly next to the .sif, not just under TMPDIR/CACHEDIR,
        # so everything needs to live under one dir that's writable end-to-end
        run: |
          mkdir -p "$RUNNER_TEMP/aptmp" "$RUNNER_TEMP/apcache"
          echo "APPTAINER_TMPDIR=$RUNNER_TEMP/aptmp" >> "$GITHUB_ENV"
          echo "APPTAINER_CACHEDIR=$RUNNER_TEMP/apcache" >> "$GITHUB_ENV"
          echo "SIF_PATH=$RUNNER_TEMP/relion.sif" >> "$GITHUB_ENV"

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2

      - name: Log in to GHCR (oras)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login -u "${{ github.actor }}" --password-stdin oras://ghcr.io

      - name: Convert pushed image to SIF and publish
        run: |
          apptainer pull "$SIF_PATH" "docker://docker.io/${{ env.DOCKERHUB_RELION_IMAGE_NAME }}:${{ matrix.tag }}"
          apptainer push "$SIF_PATH" "oras://ghcr.io/${{ github.repository_owner }}/relion-sif:${{ matrix.tag }}"

      - name: Show disk space (end)
        if: always()
        run: df -h
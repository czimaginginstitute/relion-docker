name: Trivy image scan

# HIGH/CRITICAL scan of the published images. Run before making packages public; weekly after.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.image.name }}:${{ matrix.image.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: relion,          tag: 5.1-cuda12.8 }
          - { name: relion,          tag: 5.0-cuda12.8 }
          - { name: relion,          tag: 5.0-cuda12.4 }
          - { name: relion-zarr-sta, tag: 5.0-cuda12.8 }
          - { name: relion-zarr-sta, tag: 5.0-cuda12.4 }
    steps:
      - name: Maximize build space
        uses: mathio/gha-cleanup@aca3d43a05bf564f5fc69acb929a65b01797f22b # v1
        with:
          remove-browsers: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ matrix.image.tag }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image.name }}-${{ matrix.image.tag }}

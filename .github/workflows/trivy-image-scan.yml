name: Trivy image scan

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Build & Push RELION (CUDA) to Docker Hub & GitHub Packages" ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.image.name }}:${{ matrix.image.tag }}
    # scan even if only a SIF publish failed
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event != 'pull_request' &&
       contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    permissions:
      actions: read   # upload-sarif reads the run on private repos
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: relion,          tag: 5.1-cuda12.8 }
          - { name: relion,          tag: 5.0-cuda12.8 }
          - { name: relion,          tag: 5.0-cuda12.4 }
          - { name: relion-zarr-sta, tag: 5.0-cuda12.8 }
          - { name: relion-zarr-sta, tag: 5.0-cuda12.4 }
    steps:
      - name: Maximize build space
        uses: mathio/gha-cleanup@aca3d43a05bf564f5fc69acb929a65b01797f22b # v1
        with:
          remove-browsers: true

      - name: Checkout   # for .trivyignore.yaml
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image (full report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ matrix.image.tag }}
          format: sarif
          output: trivy.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          timeout: 20m   # default 5m is too short for 5.1's torch libs
          exit-code: '0'
          trivyignores: .trivyignore.yaml

      - name: Gate on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ matrix.image.tag }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          timeout: 20m
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image.name }}-${{ matrix.image.tag }}

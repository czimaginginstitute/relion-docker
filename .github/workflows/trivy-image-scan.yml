name: Trivy image scan

# HIGH/CRITICAL scan of the published images. Run before making packages public; weekly after.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.image.name }}:${{ matrix.image.tag }}
    runs-on: ubuntu-latest
    permissions:
      actions: read   # upload-sarif reads the run on private repos
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: relion,          tag: 5.1-cuda12.8 }
          - { name: relion,          tag: 5.0-cuda12.8 }
          - { name: relion,          tag: 5.0-cuda12.4 }
          - { name: relion-zarr-sta, tag: 5.0-cuda12.8 }
          - { name: relion-zarr-sta, tag: 5.0-cuda12.4 }
    steps:
      - name: Maximize build space
        uses: mathio/gha-cleanup@aca3d43a05bf564f5fc69acb929a65b01797f22b # v1
        with:
          remove-browsers: true

      - name: Checkout   # for .trivyignore.yaml
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image (HIGH/CRITICAL report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ matrix.image.tag }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true   # otherwise the action reports (and gates on) all severities
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: .trivyignore.yaml

      - name: Gate on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ matrix.image.tag }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image.name }}-${{ matrix.image.tag }}

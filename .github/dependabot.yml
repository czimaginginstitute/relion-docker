version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # docker: FROM tags are ARG-templated, so coverage is limited but kept for any literal refs.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /extras
    schedule:
      interval: weekly
